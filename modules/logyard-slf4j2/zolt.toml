[project]
name = "logyard-slf4j2"
version = "0.1.0-rc.1"
group = "com.logyard4j"
java = "21"

[repositories]
central = "https://repo.maven.apache.org/maven2"

[dependencies]
"com.logyard4j:logyard-api" = { workspace = "modules/logyard-api" }
"com.logyard4j:logyard-runtime" = { workspace = "modules/logyard-runtime" }
"org.slf4j:slf4j-api" = "2.0.18"

[test.dependencies]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[build]
source = "src/main/java"
test = "src/test/java"
output = "target/classes"
testOutput = "target/test-classes"

[resources]
main = ["src/main/resources"]

[build.metadata]
reproducible = true

[package]
mode = "thin"
sources = true
javadoc = true

[package.metadata]
name = "Logyard SLF4J 2 Provider"
description = "SLF4J 2 provider backed by the batteries-included Logyard runtime."
url = "https://logyard4j.com"
license = "Apache-2.0"
licenseUrl = "https://www.apache.org/licenses/LICENSE-2.0.txt"
developers = ["zsumz <shawn@zsumz.com>"]
scm = "https://github.com/zsumz/logyard"
scmConnection = "scm:git:https://github.com/zsumz/logyard.git"
scmDeveloperConnection = "scm:git:ssh://git@github.com/zsumz/logyard.git"
issues = "https://github.com/zsumz/logyard/issues"

[package.manifest]
"Automatic-Module-Name" = "com.logyard4j.slf4j2"

[publish]
artifacts = ["main"]

[publish.signing]
enabled = true
keyId = "EC8E4D26598A0373"

[publish.central]
tokenEnv = "ZOLT_CENTRAL_TOKEN"
publishingType = "user-managed"
