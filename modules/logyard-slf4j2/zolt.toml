[project]
name = "logyard-slf4j2"
version = "0.7.0-SNAPSHOT"
group = "com.zsumz.logyard"
java = "21"

[repositories]
central = "https://repo.maven.apache.org/maven2"

[dependencies]
"com.zsumz.logyard:logyard-api" = { workspace = "modules/logyard-api" }
"com.zsumz.logyard:logyard-runtime" = { workspace = "modules/logyard-runtime" }
"org.slf4j:slf4j-api" = "2.0.18"

[test.dependencies]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[build]
source = "src/main/java"
test = "src/test/java"
output = "target/classes"
testOutput = "target/test-classes"

[resources]
main = ["src/main/resources"]

[build.metadata]
reproducible = true

[package]
mode = "thin"
sources = true
javadoc = true

[package.metadata]
name = "Logyard SLF4J 2 Provider"
description = "SLF4J 2 provider backed by the batteries-included Logyard runtime."
url = "https://github.com/zsumz/logyard"
license = "Apache-2.0"
developers = ["zsumz <shawn@zsumz.com>"]
scm = "https://github.com/zsumz/logyard"
issues = "https://github.com/zsumz/logyard/issues"

[package.manifest]
"Automatic-Module-Name" = "com.zsumz.logyard.slf4j2"

[publish]
artifacts = ["main", "sources", "javadoc"]
