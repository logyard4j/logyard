[project]
name = "logyard-spring-boot"
version = "0.1.0-rc.1"
group = "com.logyard4j"
java = 21
description = "Early logging, lifecycle, runtime management, Actuator, and native integration for Spring Boot."
url = "https://logyard4j.com"
issues = "https://github.com/logyard4j/logyard/issues"
license = "Apache-2.0"

[project.scm]
url = "https://github.com/logyard4j/logyard"
connection = "scm:git:https://github.com/logyard4j/logyard.git"
developerConnection = "scm:git:ssh://git@github.com/logyard4j/logyard.git"

[project.developers.zsumz]
name = "zsumz"
email = "shawn@zsumz.com"

[dependencies.api]
"com.logyard4j:logyard-api" = { workspace = true }
"com.logyard4j:logyard-jul" = { workspace = true }
"com.logyard4j:logyard-runtime" = { workspace = true }
"org.springframework.boot:spring-boot" = "3.5.16"
"org.springframework.boot:spring-boot-autoconfigure" = "3.5.16"

[dependencies.test]
"com.logyard4j:logyard-slf4j2" = { workspace = true }
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"
"org.springframework.boot:spring-boot-actuator" = "3.5.16"

[dependencies.processor]
"org.springframework.boot:spring-boot-autoconfigure-processor" = "3.5.16"
"org.springframework.boot:spring-boot-configuration-processor" = "3.5.16"

[resources]
main = ["src/main/resources"]

[build.metadata]
reproducible = true

[package]
mode = "jar"
sources = true
javadoc = true

[package.manifest]
"Automatic-Module-Name" = "com.logyard4j.logyard.spring.boot"

[publish.signing]
method = "gpg"
keyId = "EC8E4D26598A0373"

[publish.central]
tokenEnv = "ZOLT_CENTRAL_TOKEN"
mode = "manual"
