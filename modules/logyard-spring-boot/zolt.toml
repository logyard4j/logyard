[project]
name = "logyard-spring-boot"
version = "0.1.0-rc.1"
group = "com.logyard4j"
java = "21"

[repositories]
central = "https://repo.maven.apache.org/maven2"

[dependencies]
"com.logyard4j:logyard-api" = { workspace = "modules/logyard-api" }
"com.logyard4j:logyard-jul" = { workspace = "modules/logyard-jul" }
"com.logyard4j:logyard-runtime" = { workspace = "modules/logyard-runtime" }
"org.springframework.boot:spring-boot" = "3.5.16"
"org.springframework.boot:spring-boot-autoconfigure" = "3.5.16"

[annotationProcessors]
"org.springframework.boot:spring-boot-autoconfigure-processor" = "3.5.16"
"org.springframework.boot:spring-boot-configuration-processor" = "3.5.16"

[test.dependencies]
"com.logyard4j:logyard-slf4j2" = { workspace = "modules/logyard-slf4j2" }
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"
"org.springframework.boot:spring-boot-actuator" = "3.5.16"

[build]
source = "src/main/java"
test = "src/test/java"
output = "target/classes"
testOutput = "target/test-classes"

[resources]
main = ["src/main/resources"]

[build.metadata]
reproducible = true

[package]
mode = "thin"
sources = true
javadoc = true

[package.metadata]
name = "Logyard Spring Boot Integration"
description = "Early logging, lifecycle, runtime management, Actuator, and native integration for Spring Boot."
url = "https://logyard4j.com"
license = "Apache-2.0"
licenseUrl = "https://www.apache.org/licenses/LICENSE-2.0.txt"
developers = ["zsumz <shawn@zsumz.com>"]
scm = "https://github.com/logyard4j/logyard"
scmConnection = "scm:git:https://github.com/logyard4j/logyard.git"
scmDeveloperConnection = "scm:git:ssh://git@github.com/logyard4j/logyard.git"
issues = "https://github.com/logyard4j/logyard/issues"

[package.manifest]
"Automatic-Module-Name" = "com.logyard4j.spring.boot"

[publish]
artifacts = ["main"]

[publish.signing]
enabled = true
keyId = "EC8E4D26598A0373"

[publish.central]
tokenEnv = "ZOLT_CENTRAL_TOKEN"
publishingType = "user-managed"
