[project]
name = "logyard-output-json"
version = "0.1.0-rc.1"
group = "com.zsumz.logyard"
java = "21"

[repositories]
central = "https://repo.maven.apache.org/maven2"

[dependencies]
"com.zsumz.logyard:logyard-api" = { workspace = "modules/logyard-api" }

[test.dependencies]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[resources]
main = ["src/main/resources"]

[build]
source = "src/main/java"
test = "src/test/java"
output = "target/classes"
testOutput = "target/test-classes"

[build.metadata]
reproducible = true

[package]
mode = "thin"
sources = true
javadoc = true

[package.metadata]
name = "Logyard JSON Output"
description = "JSON Lines encoding, file delivery, and rotation for Logyard."
url = "https://github.com/zsumz/logyard"
license = "Apache-2.0"
licenseUrl = "https://www.apache.org/licenses/LICENSE-2.0.txt"
developers = ["zsumz <shawn@zsumz.com>"]
scm = "https://github.com/zsumz/logyard"
scmConnection = "scm:git:https://github.com/zsumz/logyard.git"
scmDeveloperConnection = "scm:git:ssh://git@github.com/zsumz/logyard.git"
issues = "https://github.com/zsumz/logyard/issues"

[package.manifest]
"Automatic-Module-Name" = "com.zsumz.logyard.output.json"

[publish]
artifacts = ["main"]

[publish.signing]
enabled = true
keyId = "EC8E4D26598A0373"

[publish.central]
tokenEnv = "ZOLT_CENTRAL_TOKEN"
publishingType = "user-managed"
