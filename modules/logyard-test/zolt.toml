[project]
name = "logyard-test"
version = "0.1.0-rc.1"
group = "com.logyard4j"
java = 21
description = "Isolated runtime capture and event assertions for tests."
url = "https://logyard4j.com"
issues = "https://github.com/logyard4j/logyard/issues"
license = "Apache-2.0"

[project.scm]
url = "https://github.com/logyard4j/logyard"
connection = "scm:git:https://github.com/logyard4j/logyard.git"
developerConnection = "scm:git:ssh://git@github.com/logyard4j/logyard.git"

[project.developers.zsumz]
name = "zsumz"
email = "shawn@zsumz.com"

[dependencies.api]
"com.logyard4j:logyard-api" = { workspace = true }
"com.logyard4j:logyard-core" = { workspace = true }

[dependencies.test]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[dependencies.policy.licenses]
allow = ["Apache-2.0", "EPL-2.0", "GPL-2.0-with-classpath-exception", "MIT"]
unknown = "fail"

[resources]
main = ["src/main/resources"]

[build.metadata]
reproducible = true

[package]
mode = "jar"
sources = true
javadoc = true

[package.manifest]
"Automatic-Module-Name" = "com.logyard4j.test"

[publish.signing]
method = "gpg"
keyId = "EC8E4D26598A0373"

[publish.central]
tokenEnv = "ZOLT_CENTRAL_TOKEN"
mode = "manual"
