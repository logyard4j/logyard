[project]
name = "logyard-bom"
version = "0.1.0-rc.1"
group = "com.zsumz.logyard"
java = "21"

[bom]
members = [
    "modules/logyard-api",
    "modules/logyard-core",
    "modules/logyard-config-toml",
    "modules/logyard-output-console",
    "modules/logyard-output-json",
    "modules/logyard-runtime",
    "modules/logyard-slf4j2",
    "modules/logyard-opentelemetry",
    "modules/logyard-spring-boot",
    "modules/logyard-spring-boot-starter",
    "modules/logyard-jul",
    "modules/logyard-system-logger",
]

[bom.versions]
# These two published artifacts are produced by Quarkus' official Maven extension reactor.
"com.zsumz.logyard:logyard-quarkus" = "0.1.0-rc.1"
"com.zsumz.logyard:logyard-quarkus-deployment" = "0.1.0-rc.1"

[package.metadata]
name = "Logyard Bill of Materials"
description = "Dependency management for the complete Logyard module family."
url = "https://github.com/zsumz/logyard"
license = "Apache-2.0"
licenseUrl = "https://www.apache.org/licenses/LICENSE-2.0.txt"
developers = ["zsumz <shawn@zsumz.com>"]
scm = "https://github.com/zsumz/logyard"
scmConnection = "scm:git:https://github.com/zsumz/logyard.git"
scmDeveloperConnection = "scm:git:ssh://git@github.com/zsumz/logyard.git"
issues = "https://github.com/zsumz/logyard/issues"

[publish.signing]
enabled = true
keyId = "EC8E4D26598A0373"

[publish.central]
tokenEnv = "ZOLT_CENTRAL_TOKEN"
publishingType = "user-managed"
