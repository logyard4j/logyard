[project]
name = "logyard-bom"
version = "0.1.0-rc.1"
group = "com.logyard4j"
description = "Dependency management for the complete Logyard module family."
url = "https://logyard4j.com"
issues = "https://github.com/logyard4j/logyard/issues"
license = "Apache-2.0"

[project.scm]
url = "https://github.com/logyard4j/logyard"
connection = "scm:git:https://github.com/logyard4j/logyard.git"
developerConnection = "scm:git:ssh://git@github.com/logyard4j/logyard.git"

[project.developers.zsumz]
name = "zsumz"
email = "shawn@zsumz.com"

[bom]
members = [
    "modules/logyard-api",
    "modules/logyard-core",
    "modules/logyard-config-toml",
    "modules/logyard-output-console",
    "modules/logyard-output-json",
    "modules/logyard-runtime",
    "modules/logyard-slf4j2",
    "modules/logyard-opentelemetry",
    "modules/logyard-test",
    "modules/logyard-spring-boot",
    "modules/logyard-spring-boot-starter",
    "modules/logyard-jul",
    "modules/logyard-system-logger",
]

[bom.versions]
# These two published artifacts are produced by Quarkus' official Maven extension reactor.
"com.logyard4j:logyard-quarkus" = "0.1.0-rc.1"
"com.logyard4j:logyard-quarkus-deployment" = "0.1.0-rc.1"

[publish.signing]
method = "gpg"
keyId = "EC8E4D26598A0373"

[publish.central]
tokenEnv = "ZOLT_CENTRAL_TOKEN"
mode = "manual"
