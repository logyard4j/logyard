[project]
name = "logyard-bom"
version = "0.7.0-SNAPSHOT"
group = "com.zsumz.logyard"

[package]

[package.metadata]
name = "Logyard Bill of Materials"
description = "Dependency management for the complete Logyard module family."
url = "https://github.com/zsumz/logyard"
license = "Apache-2.0"
developers = ["zsumz <shawn@zsumz.com>"]
scm = "https://github.com/zsumz/logyard"
issues = "https://github.com/zsumz/logyard/issues"

[publication]
packaging = "pom"
artifacts = ["pom"]

[dependencyManagement]
"com.zsumz.logyard:logyard-api" = { workspace = "modules/logyard-api" }
"com.zsumz.logyard:logyard-config-toml" = { workspace = "modules/logyard-config-toml" }
"com.zsumz.logyard:logyard-core" = { workspace = "modules/logyard-core" }
"com.zsumz.logyard:logyard-jul" = { workspace = "modules/logyard-jul" }
"com.zsumz.logyard:logyard-output-console" = { workspace = "modules/logyard-output-console" }
"com.zsumz.logyard:logyard-output-json" = { workspace = "modules/logyard-output-json" }
"com.zsumz.logyard:logyard-runtime" = { workspace = "modules/logyard-runtime" }
"com.zsumz.logyard:logyard-slf4j2" = { workspace = "modules/logyard-slf4j2" }
"com.zsumz.logyard:logyard-system-logger" = { workspace = "modules/logyard-system-logger" }
