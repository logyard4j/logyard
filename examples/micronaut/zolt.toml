[project]
name = "logyard-micronaut-example"
version = "1.0.0-SNAPSHOT"
group = "com.logyard4j.examples"
java = 21
main = "com.logyard4j.examples.micronaut.MicronautExampleApplication"

[platforms]
"com.logyard4j:logyard-bom" = "0.1.0-rc.1"
"io.micronaut.platform:micronaut-platform" = "4.10.9"

[dependencies]
"io.micronaut:micronaut-http-server-netty" = { managed = true }
"io.micronaut.serde:micronaut-serde-jackson" = { managed = true }
"com.logyard4j:logyard-slf4j2" = { managed = true }

[dependencies.processor]
"io.micronaut:micronaut-inject-java" = { managed = true }
"io.micronaut:micronaut-http-validation" = { managed = true }
"io.micronaut.serde:micronaut-serde-processor" = { managed = true }

[resources]
main = ["src/main/resources"]
test = ["src/test/resources"]
