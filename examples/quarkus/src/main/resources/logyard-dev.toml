schema = 1

[service]
name = "logyard-quarkus-example"
environment = "dev-verification"

[runtime]
watch = false
internal_status = "warn"

[delivery]
mode = "sync"
capacity = 64

[context]
mdc = ["request.id", "authorization", "session.token"]
redact = ["authorization", "mdc.*token"]

[loggers]
root = { level = "info", outputs = ["json"] }
"io.quarkus" = { level = "info" }

[outputs.json]
type = "file"
path = "${LOGYARD_EXAMPLE_OUTPUT}"
append = true
buffer = "4KiB"
flush = "0s"
