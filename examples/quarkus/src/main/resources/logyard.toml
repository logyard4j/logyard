schema = 1

[service]
name = "logyard-quarkus-example"
environment = "verification"

[runtime]
watch = false
internal_status = "warn"

[delivery]
mode = "async"
capacity = 256

[delivery.overflow]
trace = "drop"
debug = "drop"
info = "drop"
warn = "drop"
error = "drop"

[context]
mdc = ["request.id", "authorization", "session.token"]
redact = ["authorization", "*.token"]

[loggers]
root = { level = "info", outputs = ["json"] }
"io.quarkus" = { level = "info" }

[outputs.json]
type = "file"
path = "${LOGYARD_EXAMPLE_OUTPUT:-target/quarkus-test.jsonl}"
append = false
buffer = "4KiB"
flush = "1s"
