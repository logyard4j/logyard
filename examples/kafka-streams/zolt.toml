[project]
name = "logyard-kafka-streams-example"
version = "1.0.0-SNAPSHOT"
group = "com.logyard4j.logyard.examples"
java = 21
main = "com.logyard4j.logyard.examples.kafkastreams.KafkaStreamsExampleApplication"

[platforms]
"com.logyard4j:logyard-bom" = "0.1.0-rc.2"

[dependencies]
"com.logyard4j:logyard-slf4j2" = { managed = true }
"org.apache.kafka:kafka-streams" = "4.3.1"

[dependencies.test]
"org.apache.kafka:kafka-streams-test-utils" = "4.3.1"
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[resources]
main = ["src/main/resources"]
test = ["src/test/resources"]
