[project]
name = "logyard-vertx-example"
version = "1.0.0-SNAPSHOT"
group = "com.logyard4j.examples"
java = "21"
main = "com.logyard4j.examples.vertx.VertxExampleApplication"

[platforms]
"com.logyard4j:logyard-bom" = "0.1.0-rc.1"
"io.vertx:vertx-stack-depchain" = "5.1.5"

[dependencies]
"io.vertx:vertx-web" = {}
"com.logyard4j:logyard-slf4j2" = {}

[build]
source = "src/main/java"
test = "src/test/java"
output = "target/classes"
testOutput = "target/test-classes"

[resources]
main = ["src/main/resources"]
test = ["src/test/resources"]
