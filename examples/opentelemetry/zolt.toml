[project]
name = "logyard-opentelemetry-example"
version = "1.0.0-SNAPSHOT"
group = "com.logyard4j.examples"
java = "21"
main = "com.logyard4j.examples.opentelemetry.OpenTelemetryExampleApplication"

[platforms]
"com.logyard4j:logyard-bom" = "0.1.0-rc.1"

[dependencies]
"com.logyard4j:logyard-slf4j2" = {}
"com.logyard4j:logyard-opentelemetry" = {}

[resources]
main = ["src/main/resources"]

[test.dependencies]
"io.opentelemetry:opentelemetry-sdk" = "1.65.0"
"io.opentelemetry:opentelemetry-sdk-testing" = "1.65.0"
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"
