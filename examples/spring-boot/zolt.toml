[project]
name = "logyard-spring-boot-example"
version = "1.0.0-SNAPSHOT"
group = "com.logyard4j.logyard.examples"
java = 21
main = "com.logyard4j.logyard.examples.springboot.SpringBootExampleApplication"

[platforms]
"com.logyard4j:logyard-bom" = "0.1.0-rc.2"
"org.springframework.boot:spring-boot-dependencies" = "4.1.0"

[dependencies]
"org.springframework.boot:spring-boot-starter-webmvc" = { managed = true, exclude = ["org.springframework.boot:spring-boot-starter-logging"] }
"org.springframework.boot:spring-boot-starter-actuator" = { managed = true, exclude = ["org.springframework.boot:spring-boot-starter-logging"] }
"com.logyard4j:logyard-spring-boot-starter" = { managed = true }
"com.logyard4j:logyard-opentelemetry" = { managed = true }
"io.opentelemetry:opentelemetry-api" = { managed = true }

[resources]
main = ["src/main/resources"]
test = ["src/test/resources"]

[package]
mode = "spring-boot"
