[project]
name = "logyard-adapter-canaries"
version = "0.1.0-rc.1"
group = "com.logyard4j"
java = "21"
main = "com.logyard4j.canaries.RuntimeCanaries"

[repositories]
central = "https://repo.maven.apache.org/maven2"

[dependencies]
"com.logyard4j:logyard-api" = { workspace = "modules/logyard-api" }
"com.logyard4j:logyard-core" = { workspace = "modules/logyard-core" }
"com.logyard4j:logyard-config-toml" = { workspace = "modules/logyard-config-toml" }
"com.logyard4j:logyard-output-console" = { workspace = "modules/logyard-output-console" }
"com.logyard4j:logyard-output-json" = { workspace = "modules/logyard-output-json" }
"com.logyard4j:logyard-runtime" = { workspace = "modules/logyard-runtime" }

"com.logyard4j:logyard-jul" = { workspace = "modules/logyard-jul" }
"com.logyard4j:logyard-system-logger" = { workspace = "modules/logyard-system-logger" }
"com.logyard4j:logyard-slf4j2" = { workspace = "modules/logyard-slf4j2" }

[build]
source = "src/main/java"
output = "target/classes"

[build.metadata]
reproducible = true
