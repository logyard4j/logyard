name: Lifecycle soak

on:
  push:
    branches:
      - 'soak/**'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Reload/shutdown cycles in one JVM (1200 takes roughly four hours)'
        type: choice
        default: '1200'
        options:
          - '12'
          - '600'
          - '1200'

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-zcheck
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap the pinned Zolt revision
        run: zcheck run bootstrap --format github --logs-dir "$RUNNER_TEMP/zcheck/bootstrap-logs" --receipt "$RUNNER_TEMP/zcheck/bootstrap.json"
      - name: Put Zolt on PATH
        run: python3 -c 'from pathlib import Path; print(Path.home() / ".zolt" / "bin")' >> "$GITHUB_PATH"
      - name: Soak packaged reload and shutdown in one JVM
        env:
          SOAK_CYCLES: ${{ inputs.cycles || '1200' }}
        # End before the hosted job limit so an interrupted run can retain its evidence.
        run: zcheck run soak --format github --logs-dir "$RUNNER_TEMP/zcheck/soak-logs" --receipt "$RUNNER_TEMP/zcheck/soak.json" -- --cycles "$SOAK_CYCLES"
      - name: Publish lifecycle evidence summary
        if: always()
        run: zcheck run soak-summary --format github --logs-dir "$RUNNER_TEMP/zcheck/soak-summary-logs" --receipt "$RUNNER_TEMP/zcheck/soak-summary.json"
      - name: Retain lifecycle and resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lifecycle-soak-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            target/benchmark-lifecycle-soak/latest.txt
            target/benchmark-lifecycle-soak/*/*.json
            target/benchmark-lifecycle-soak/*/*.jsonl
            target/benchmark-lifecycle-soak/*/*.log
            target/benchmark-lifecycle-soak/*/cycle-*/*
            target/benchmark-lifecycle-soak/*/projects/logyard/zolt.lock
          if-no-files-found: warn
      - name: Upload zcheck logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcheck-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zcheck
          if-no-files-found: ignore
