name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  native-gate:
    name: Native release-candidate gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1.5.3
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          native-image-job-reports: 'true'
      - name: Bootstrap the pinned Zolt revision
        run: ./scripts/bootstrap-zolt
      - name: Put Zolt on PATH
        run: echo "$HOME/.zolt/bin" >> "$GITHUB_PATH"
      - name: Build and run the published-shaped native consumers
        run: |
          ./scripts/release-bundle
          LOGYARD_EXAMPLES_SKIP_RELEASE=1 ./scripts/examples-native-verify

  release:
    needs: native-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the release tag
        run: |
          version="$(PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 -m release_tools.manifest_cli version "$GITHUB_WORKSPACE")"
          [[ "$version" != *-SNAPSHOT ]] || {
            echo "release versions must not end in -SNAPSHOT" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          }
      - name: Bootstrap the pinned Zolt revision
        run: ./scripts/bootstrap-zolt
      - name: Put Zolt on PATH
        run: echo "$HOME/.zolt/bin" >> "$GITHUB_PATH"
      - name: Import the release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [[ -n "$GPG_PRIVATE_KEY" ]] || {
            echo "GPG_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Test and assemble the signed release bundle
        env:
          LOGYARD_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          LOGYARD_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          zolt resolve --workspace
          ./scripts/ci
          ./scripts/api-compatibility --baseline
          ./scripts/release-bundle --sign
          ./scripts/zolt-publication-check
          LOGYARD_EXAMPLES_SKIP_RELEASE=1 ./scripts/examples-verify
          LOGYARD_BENCHMARK_SKIP_RELEASE=1 ./scripts/benchmark-smoke
      - name: Create the Central Portal archive
        env:
          LOGYARD_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          LOGYARD_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          version="$(cat target/release-bundle/VERSION)"
          archive="$GITHUB_WORKSPACE/target/logyard-$version-central-bundle.zip"
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" python3 -m release_tools.central target/release-bundle "$archive"
          sha256sum "$archive" > "$archive.sha256"
          if [[ -n "$LOGYARD_GPG_PASSPHRASE" ]]; then
            printf '%s' "$LOGYARD_GPG_PASSPHRASE" \
              | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                  --local-user "$LOGYARD_GPG_KEY_ID" --armor --detach-sign "$archive"
          else
            gpg --batch --yes --local-user "$LOGYARD_GPG_KEY_ID" --armor --detach-sign "$archive"
          fi
      - name: Publish and verify the Maven Central deployment
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          LOGYARD_CENTRAL_SKIP_RELEASE: '1'
        run: |
          version="$(cat target/release-bundle/VERSION)"
          export LOGYARD_CENTRAL_BUNDLE="$GITHUB_WORKSPACE/target/logyard-$version-central-bundle.zip"
          ./scripts/central-publish --upload --automatic --wait
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat target/release-bundle/VERSION)"
          archive="target/logyard-$version-central-bundle.zip"
          release_flags=()
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$archive" "$archive.sha256" "$archive.asc" \
            --title "Logyard $version" \
            --generate-notes \
            "${release_flags[@]}" \
            --verify-tag
