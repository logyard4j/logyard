name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated PGP-signed release tag
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: logyard-release
  cancel-in-progress: false

jobs:
  provenance:
    name: Verify release provenance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      tag: ${{ steps.verify.outputs.tag }}
      tag_object: ${{ steps.verify.outputs.tag_object }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-zcheck
      - name: Exercise the provenance boundary with disposable keys
        run: zcheck run provenance-canary --format github --logs-dir "$RUNNER_TEMP/zcheck/provenance-canary-logs" --receipt "$RUNNER_TEMP/zcheck/provenance-canary.json"
      - name: Verify the signed tag before executing release code
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TRUSTED_MAIN_SHA: ${{ github.sha }}
        run: zcheck run provenance --format github --logs-dir "$RUNNER_TEMP/zcheck/provenance-logs" --receipt "$RUNNER_TEMP/zcheck/provenance.json"
      - name: Upload zcheck logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcheck-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zcheck
          if-no-files-found: ignore

  release:
    needs: provenance
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.provenance.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-zcheck
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Bootstrap the pinned Zolt revision
        run: zcheck run bootstrap --format github --logs-dir "$RUNNER_TEMP/zcheck/bootstrap-logs" --receipt "$RUNNER_TEMP/zcheck/bootstrap.json"
      - name: Put Zolt on PATH
        run: python3 -c 'from pathlib import Path; print(Path.home() / ".zolt" / "bin")' >> "$GITHUB_PATH"
      - name: Import the release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [[ -n "$GPG_PRIVATE_KEY" ]] || {
            echo "GPG_PRIVATE_KEY is not configured" >&2
            exit 1
          }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Test and assemble the signed release bundle
        env:
          LOGYARD_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          LOGYARD_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          zcheck run check api-self-test --format github --logs-dir "$RUNNER_TEMP/zcheck/check-logs" --receipt "$RUNNER_TEMP/zcheck/check.json"
          zcheck run bundle --format github --logs-dir "$RUNNER_TEMP/zcheck/bundle-logs" --receipt "$RUNNER_TEMP/zcheck/bundle.json" -- --sign
          zcheck run publications --format github --logs-dir "$RUNNER_TEMP/zcheck/publications-logs" --receipt "$RUNNER_TEMP/zcheck/publications.json" -- --signed
          LOGYARD_EXAMPLES_SKIP_RELEASE=1 zcheck run examples --format github --logs-dir "$RUNNER_TEMP/zcheck/examples-logs" --receipt "$RUNNER_TEMP/zcheck/examples.json"
          zcheck run ecs --format github --logs-dir "$RUNNER_TEMP/zcheck/ecs-logs" --receipt "$RUNNER_TEMP/zcheck/ecs.json"
          LOGYARD_BENCHMARK_SKIP_RELEASE=1 zcheck run benchmark-smoke --format github --logs-dir "$RUNNER_TEMP/zcheck/benchmark-smoke-logs" --receipt "$RUNNER_TEMP/zcheck/benchmark-smoke.json"
          LOGYARD_COMPARISON_SKIP_RELEASE=1 zcheck run comparison --format github --logs-dir "$RUNNER_TEMP/zcheck/comparison-logs" --receipt "$RUNNER_TEMP/zcheck/comparison.json"
      - name: Upload example smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-smoke-results
          path: |
            target/examples-verify/smoque.json
            target/examples-verify/smoque.xml
            target/examples-verify/*.log
            target/examples-verify/*.jsonl
            target/ecs-verify/
            target/benchmark-smoke/*.json
            target/benchmark-smoke/*.jsonl
            target/benchmark-compare/smoque.*
            target/benchmark-compare/smoke.log
            target/benchmark-compare/*/results.json
            target/benchmark-compare/*/artifacts.json
            target/benchmark-compare/*/environment.json
            target/benchmark-compare/*/*-build.log
            target/benchmark-compare/*/iteration-*/*.log
            target/benchmark-compare/*/iteration-*/*.jsonl
            target/benchmark-compare/*/projects/*/zolt.lock
          if-no-files-found: ignore
      - name: Create the Central Portal archive
        env:
          LOGYARD_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          LOGYARD_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          version="$(cat target/release-bundle/VERSION)"
          archive="$GITHUB_WORKSPACE/target/logyard-$version-central-bundle.zip"
          export LOGYARD_CENTRAL_SKIP_RELEASE=1
          export LOGYARD_CENTRAL_BUNDLE="$archive"
          zcheck run central --format github --logs-dir "$RUNNER_TEMP/zcheck/central-logs" --receipt "$RUNNER_TEMP/zcheck/central.json"
          sha256sum "$archive" > "$archive.sha256"
          if [[ -n "$LOGYARD_GPG_PASSPHRASE" ]]; then
            printf '%s' "$LOGYARD_GPG_PASSPHRASE" \
              | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                  --local-user "$LOGYARD_GPG_KEY_ID" --armor --detach-sign "$archive"
          else
            gpg --batch --yes --local-user "$LOGYARD_GPG_KEY_ID" --armor --detach-sign "$archive"
          fi
      - name: Publish and verify the Maven Central deployment
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          LOGYARD_CENTRAL_SKIP_RELEASE: '1'
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.provenance.outputs.tag }}
          VERIFIED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        run: |
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          [[ "$remote_tag_object" == "$VERIFIED_TAG_OBJECT" ]] || {
            echo "remote tag changed after provenance verification" >&2
            exit 1
          }
          version="$(cat target/release-bundle/VERSION)"
          export LOGYARD_CENTRAL_BUNDLE="$GITHUB_WORKSPACE/target/logyard-$version-central-bundle.zip"
          zcheck run central --format github --logs-dir "$RUNNER_TEMP/zcheck/publish-logs" --receipt "$RUNNER_TEMP/zcheck/publish.json" -- --upload --automatic --wait
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.provenance.outputs.tag }}
          VERIFIED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        run: |
          remote_tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          [[ "$remote_tag_object" == "$VERIFIED_TAG_OBJECT" ]] || {
            echo "remote tag changed during publication" >&2
            exit 1
          }
          version="$(cat target/release-bundle/VERSION)"
          archive="target/logyard-$version-central-bundle.zip"
          release_flags=()
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "$archive" "$archive.sha256" "$archive.asc" \
            --title "Logyard $version" \
            --generate-notes \
            "${release_flags[@]}" \
            --verify-tag
      - name: Upload zcheck logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zcheck-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zcheck
          if-no-files-found: ignore
