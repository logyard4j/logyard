name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Repository and JDK-only checks
        run: ./scripts/ci
      - name: Build and test the Zolt workspace
        run: |
          ./scripts/bootstrap-zolt
          export PATH="$HOME/.zolt/bin:$PATH"
          zolt resolve --workspace
          zolt build --workspace --all
          zolt test --workspace --all
          zolt run --workspace --member tests/logyard-integration-tests
