name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Bootstrap the pinned Zolt revision
        run: ./scripts/bootstrap-zolt
      - name: Put Zolt on PATH
        run: echo "$HOME/.zolt/bin" >> "$GITHUB_PATH"
      - name: Resolve the locked workspace
        run: zolt resolve --workspace
      - name: Repository, Javadoc, build, and test checks
        run: ./scripts/ci
      - name: Force the dependency-free verification path
        env:
          LOGYARD_VERIFY_FORCE_FALLBACK: '1'
          LOGYARD_VERIFY_TARGET: ${{ runner.temp }}/logyard-offline-verify
        run: ./scripts/verify
      - name: Package and verify the published Maven surface
        run: ./scripts/release-bundle
      - name: Enforce the reviewed API compatibility baseline policy
        run: ./scripts/api-compatibility --baseline
      - name: Smoke japicmp wiring and public-surface filters
        run: ./scripts/api-compatibility --self-test
      - name: Verify the Zolt workspace publication family
        run: ./scripts/zolt-publication-check
      - name: Smoke Zolt consumer examples
        env:
          LOGYARD_EXAMPLES_SKIP_RELEASE: '1'
        run: ./scripts/examples-verify
      - name: Smoke the benchmark harness
        run: ./scripts/benchmark-smoke
      - name: Upload example smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-smoke-results
          path: |
            target/examples-verify/smoque.json
            target/examples-verify/smoque.xml
            target/examples-verify/*.log
            target/examples-verify/*.jsonl
          if-no-files-found: ignore

  ecs:
    name: ECS ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Bootstrap the pinned Zolt revision
        run: ./scripts/bootstrap-zolt
      - name: Put Zolt on PATH
        run: echo "$HOME/.zolt/bin" >> "$GITHUB_PATH"
      - name: Verify ECS ingestion and standard queries
        run: ./scripts/ecs-verify
      - name: Upload ECS smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecs-smoke-results
          path: target/ecs-verify/
          if-no-files-found: ignore

  platform:
    name: Platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap the pinned Zolt revision
        run: ./scripts/bootstrap-zolt
      - name: Put Zolt on PATH
        run: echo "$HOME/.zolt/bin" >> "$GITHUB_PATH"
      - name: Exercise file locking, reload, rotation, and packaged services
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/logyard-release.sh"
          test_members="$(logyard_test_members | paste -sd, -)"
          zolt resolve --workspace
          zolt test --workspace --members "$test_members" --no-progress --color never
          ./scripts/package
          ./scripts/package-verify

  forward-jdk:
    name: Forward compatibility (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Bootstrap the pinned Zolt revision
        run: ./scripts/bootstrap-zolt
      - name: Put Zolt on PATH
        run: echo "$HOME/.zolt/bin" >> "$GITHUB_PATH"
      - name: Build and test the Java 21 surface on JDK 25
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/logyard-release.sh"
          test_members="$(logyard_test_members | paste -sd, -)"
          zolt resolve --workspace
          zolt build --workspace --all --no-progress --color never
          zolt test --workspace --members "$test_members" --no-progress --color never
