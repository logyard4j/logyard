[project]
name = "comparison-logyard"
version = "0.1.0"
group = "com.logyard4j.benchmarks"
java = "21"
main = "com.logyard4j.compare.ComparisonMain"

[dependencies]
"com.logyard4j:logyard-slf4j2" = "0.1.0-rc.1"
"com.logyard4j:logyard-runtime" = "0.1.0-rc.1"
"org.slf4j:slf4j-api" = "2.0.18"

[test.dependencies]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[build]
source = "src/main/java"
test = "src/test/java"
output = "target/classes"
testOutput = "target/test-classes"

[resources]
main = ["src/main/resources"]
